# The Buy List web version's morning scan: reads CarGurus, the dealer websites in
# used-cars/buy-list/dealers.csv and (with a free key) Marketcheck on GitHub's
# servers, then publishes the results to the Cloudflare app. Mon-Sat before the
# store opens, or by hand: Actions → Buy List scan → Run workflow.
name: Buy List scan

on:
  schedule:
    - cron: "45 10 * * 1-6" # 5:45 AM Central in summer, 4:45 AM in winter (GitHub can start a little late)
  workflow_dispatch:

permissions:
  contents: write # saves the scan's memory to the buy-list-state branch

concurrency:
  group: buy-list-scan

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::Buy List web version isn't set up yet (Cloudflare secrets missing), so no scan ran."
            exit 0
          fi
          echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
          exit 1

  scan:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: used-cars/buy-list
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: used-cars/buy-list/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load the last scan's memory
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          if git fetch -q --depth=1 origin buy-list-state 2>/dev/null; then
            git show FETCH_HEAD:market.json.gz > "$RUNNER_TEMP/scan/market.json.gz"
          else
            echo "First scan: starting fresh."
          fi
      - name: Find or create the Cloudflare storage
        run: node cloud/ensure.mjs
      - name: Read the manager's side (called cars, hidden dealers)
        working-directory: used-cars/buy-list/cloud
        run: |
          npx wrangler d1 execute buylist --remote --yes --file schema.sql > /dev/null
          npx wrangler d1 execute buylist --remote --json --command "SELECT key FROM car_state WHERE last_call_at IS NOT NULL" > "$RUNNER_TEMP/scan/called.json"
          npx wrangler d1 execute buylist --remote --json --command "SELECT dealer_key, name FROM hidden" > "$RUNNER_TEMP/scan/hidden.json"
      - name: Scan
        id: scan
        run: >
          node scripts/cloud-scan.mjs
          --state "$RUNNER_TEMP/scan/market.json.gz"
          --called "$RUNNER_TEMP/scan/called.json"
          --hidden "$RUNNER_TEMP/scan/hidden.json"
          --out "$RUNNER_TEMP/scan/out"
      - name: Publish to the website
        working-directory: used-cars/buy-list/cloud
        run: |
          for key in status aged dealers; do
            npx wrangler kv key put "$key" --binding DATA --remote --path "$RUNNER_TEMP/scan/out/$key.json"
          done
      - name: Save this scan's memory for tomorrow
        working-directory: ${{ runner.temp }}/scan/out
        run: |
          git init -q
          git checkout -q -b buy-list-state
          git add market.json.gz
          git -c user.name="buy-list-scan" -c user.email="buy-list-scan@users.noreply.github.com" commit -qm "Buy List scan state"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buy-list-state
      - name: Keep what the scan saw on sites it couldn't read
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buy-list-debug
          path: used-cars/buy-list/.scan-data/work/debug
          if-no-files-found: ignore
          retention-days: 7
      - name: Flag a morning where every source failed
        if: steps.scan.outputs.ok == 'false'
        run: |
          echo "::error::Every source failed this morning. See the Scan step and the buy-list-debug files."
          exit 1
