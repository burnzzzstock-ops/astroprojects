name: CI

on:
  pull_request:
  push:

jobs:
  hiring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hiring
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hiring/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks + compliance tests
        run: npm test
